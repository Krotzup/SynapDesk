name: ML tests

on:
  pull_request:
    paths:
      - "ml/**"
      - "tests/ml/**"
      - ".github/workflows/ml-tests.yml"
  push:
    branches:
      - main
    paths:
      - "ml/**"
      - "tests/ml/**"
      - ".github/workflows/ml-tests.yml"

jobs:
  ml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Install semantic dependencies when integrated
        if: ${{ hashFiles('ml/requirements-semantic.txt') != '' }}
        run: python -m pip install -r ml/requirements-semantic.txt -c ml/requirements.txt

      - name: Install corpus preparation dependencies
        # El preparador se prueba con HTML sintético, sin descargar fuentes.
        run: python -m pip install -r ml/requirements-corpus.txt

      - name: Compile ML sources
        run: python -m compileall -q ml tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Train with synthetic dataset
        run: >
          python ml/train_ticket_classifier.py
          --input-csv ml/samples/tickets_esp_sintetico.csv
          --language es
          --min-target-count 1
          --max-features 2000
          --output-dir ml/artifacts/ticket_classifier_sample

      - name: Train optional priority character features with synthetic dataset
        run: >
          python ml/train_ticket_classifier.py
          --input-csv ml/samples/tickets_esp_sintetico.csv
          --language es
          --min-target-count 1
          --max-features 2000
          --character-ngram-targets priority
          --disable-business-rules
          --output-dir ml/artifacts/ticket_classifier_priority_chars_sample
