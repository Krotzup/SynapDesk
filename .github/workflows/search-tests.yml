name: Search integration checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "ml/semantic_retrieval/**"
      - ".github/workflows/search-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ml/semantic_retrieval/**"
      - ".github/workflows/search-tests.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend without optional model or database
        working-directory: backend
        run: python -m pytest pruebas -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_USE_MOCKS: "false"
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
